<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.js + Jenkins CI/CD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            max-width: 500px;
            width: 100%;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .badge {
            display: inline-block;
            background-color: #e6f4ea;
            color: #137333;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            color: #1a1a1a;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 28px;
        }
        button {
            background-color: #2ea44f;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #2c974b;
        }
        .status-text {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            color: #2ea44f;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">● Node.js + Jenkins Pipeline</div>
        <h1>App Deployed Successfully</h1>
        <p>This HTML page is served by a Node.js Express backend and automated via Jenkins.</p>
        <button onclick="checkBackend()">Ping Node.js Backend</button>
        <div id="status" class="status-text"></div>
    </div>

    <script>
        async function checkBackend() {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = "Checking server...";
            try {
                const response = await fetch('/health');
                const data = await response.json();
                statusDiv.textContent = `Server Status: ${data.status} (${new Date(data.timestamp).toLocaleTimeString()})`;
            } catch (error) {
                statusDiv.style.color = "#d93025";
                statusDiv.textContent = "Error: Could not reach Node.js backend.";
            }
        }
    </script>

</body>
</html>
